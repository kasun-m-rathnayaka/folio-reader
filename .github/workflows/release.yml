name: Release Folio
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    # Folio Web on GitHub Pages: a static, local-first PWA (no server, no account, no telemetry).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: WebAssembly build tools
        run: dotnet workload install wasm-tools
      - name: Publish
        run: dotnet publish src/Folio.Web -c Release -warnaserror -o .artifacts/web
      - name: Prepare for a project site
        run: |
          site=.artifacts/web/wwwroot
          base="/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|<base href=\"/\" />|<base href=\"$base\" />|" "$site/index.html"
          rm -f "$site/index.html.gz" "$site/index.html.br"
          cp "$site/index.html" "$site/404.html"   # deep links such as /shelf or /book/{id} load the app
          touch "$site/.nojekyll"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .artifacts/web/wwwroot
      - id: deploy
        uses: actions/deploy-pages@v5

  desktop:
    # The Windows build attached to a GitHub release for version tags (v1.2.3).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: WebAssembly build tools
        run: dotnet workload install wasm-tools
      - name: Publish
        run: dotnet publish src/Folio.Desktop -c Release --self-contained false -o .artifacts/release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path .artifacts/release/* -DestinationPath "Folio-${{ github.ref_name }}-win-x64.zip"
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "Folio-${{ github.ref_name }}-win-x64.zip" --title "Folio ${{ github.ref_name }}" --generate-notes
